server:
  port: 8083

spring:
  application:
    name: AUTH-SERVICE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

auth:
  admin:
    username: ${AUTH_ADMIN_USERNAME}
    password: ${AUTH_ADMIN_PASSWORD}
