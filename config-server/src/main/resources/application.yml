server:
  port: 8888

spring:
  application:
    name: CONFIG-SERVER

  profiles:
    active: ${CONFIG_SERVER_PROFILE:native}

  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:../config-repo}
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/omkar-shelar/microservices-jwt-gateway}
          search-paths: config-repo

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
